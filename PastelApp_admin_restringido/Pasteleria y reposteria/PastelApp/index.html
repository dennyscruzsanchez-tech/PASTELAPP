```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PastelApp — Iniciar sesión</title>
  <meta
    name="description"
    content="Inicio de sesión de PastelApp."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Poppins", "system-ui", "sans-serif"]
          },
          colors: {
            rose: {
              soft: "#e891a8",
              dark: "#d46b88",
              light: "#fce8ee"
            },
            cream: {
              DEFAULT: "#fff9f5",
              dark: "#f5ebe3"
            },
            chocolate: {
              DEFAULT: "#5c3d2e",
              soft: "#8b6355"
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="font-sans antialiased">

  <!-- Banner -->
  <div class="bg-chocolate text-white text-center text-xs sm:text-sm py-2 px-4">
    PastelApp — Acceso al sistema
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16 md:h-[4.25rem]">

        <a
          href="index.html"
          class="brand-logo text-xl sm:text-2xl flex items-center gap-1.5"
          aria-label="PastelApp inicio"
        >
          <span aria-hidden="true">🍰</span>
          PastelApp
        </a>

        <a
          href="index.html"
          class="nav-link"
        >
          Volver al inicio
        </a>

      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="min-h-[calc(100vh-9rem)] flex items-center justify-center py-12 px-4">

    <section
      class="w-full max-w-md"
      aria-labelledby="login-title"
    >

      <div class="bg-white rounded-2xl shadow-lg border border-[var(--color-border)] p-6 sm:p-8">

        <!-- Encabezado -->
        <div class="text-center mb-7">

          <div
            class="text-5xl mb-4"
            aria-hidden="true"
          >
            🍰
          </div>

          <h1
            id="login-title"
            class="section-title text-2xl sm:text-3xl mb-2"
          >
            Iniciar sesión
          </h1>

          <p class="text-sm text-[var(--color-muted)]">
            Ingresa a tu cuenta de PastelApp.
          </p>

        </div>

        <!-- Formulario -->
        <form
          id="login-form"
          class="space-y-4"
        >

          <!-- Correo -->
          <div>

            <label
              class="form-label"
              for="login-email"
            >
              Correo electrónico
            </label>

            <input
              class="form-input"
              id="login-email"
              name="email"
              type="email"
              required
              autocomplete="username"
              placeholder="correo@ejemplo.com"
            />

          </div>

          <!-- Contraseña -->
          <div>

            <label
              class="form-label"
              for="login-pass"
            >
              Contraseña
            </label>

            <input
              class="form-input"
              id="login-pass"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña"
            />

          </div>

          <!-- Mensaje de error -->
          <p
            id="login-error"
            class="text-sm text-red-600 hidden"
            role="alert"
          ></p>

          <!-- Botón -->
          <button
            id="login-submit"
            type="submit"
            class="btn-primary w-full"
          >
            Iniciar sesión
          </button>

        </form>

        <!-- Registro -->
        <div class="text-center mt-6 pt-6 border-t border-[var(--color-border)]">

          <p class="text-sm text-[var(--color-muted)] mb-2">
            ¿No tienes una cuenta?
          </p>

          <a
            href="registro.html"
            class="font-semibold text-rose-dark hover:underline"
          >
            Crear una cuenta
          </a>

        </div>

      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

      <p class="text-center text-xs text-white/60">
        Proyecto académico — PastelApp
      </p>

    </div>

  </footer>

  <!-- JavaScript general -->
  <script src="js/scripts.js"></script>

  <!-- Firebase Authentication -->
  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>
</html>
```
